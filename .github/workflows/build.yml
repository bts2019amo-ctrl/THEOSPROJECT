name: Build Theos package

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid dpkg xz

      - name: Install Theos
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/bootstrap"
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          ln -s "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build package
        run: make package FINALPACKAGE=1 IGNORE_WARNINGS=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: theos-package
          path: packages/*.deb
          if-no-files-found: error
